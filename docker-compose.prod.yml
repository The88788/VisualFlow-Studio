services:
  veoapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: myflow:production
    container_name: myflow
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./browser_profiles:/app/browser_profiles
      - ./gflow_profiles:/app/gflow_profiles
    environment:
      TZ: UTC
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      VEOAPI_BROWSER_PROFILE_ROOT: /app/browser_profiles
      GFLOW_CLI_HOME: /app/gflow_profiles
      GFLOW_CLI_HEADLESS: "false"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 6g
    cpus: 4.0
    pids_limit: 1024
    shm_size: 1g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
